name: 서울 임대주택 공고 알림

on:
  schedule:
    # 평일 07:47 KST = 22:47 UTC (일~목). 정시(:00) 예약은 GitHub 대기열에서 몇 시간씩 밀려 비켜 잡는다
    - cron: "47 22 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송 없이 실행 (1이면 카톡·슬랙 모두 발송 안 함)"
        required: false
        default: "0"
      rewind:
        description: "테스트용 — 마지막 확인 공고 번호(boardId)를 이 값으로 되돌림 (예: 6730)"
        required: false
        default: ""
      slack_test:
        description: "슬랙 시험 — 1이면 슬랙에 시험 메시지 1건만 보냄 (상태 파일·카톡 안 건드림)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: notice
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 카톡 발송 스위치: "0" 끔(2026-11-18부터 슬랙만), "1" 켬.
      # 꺼 두면 카톡 카드 이미지용 설치(크로미움·한글 폰트)도 건너뛴다(폰트 설치가 20분 제한에 걸려 실행이 취소된 적 있음).
      KAKAO_ENABLED: "0"
      # 슬랙 표 열: "full"(타입/전용㎡/대상/비율/보증금/월세) · "compact"(휴대폰에서 잘리면 — 대상을 타입 옆에 붙임)
      SLACK_TABLE_COLS: "full"
    steps:
      - uses: actions/checkout@v4

      # 슬랙이 유일한 알림 수단이므로 웹훅이 비어 있으면 조용히 넘어가지 않고 여기서 실패로 멈춘다.
      # (실패하면 뒤의 결과 커밋도 돌지 않아 '커밋 = 발송 성공' 구조가 유지된다)
      - name: 슬랙 웹훅 점검
        if: inputs.dry_run != '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL//[[:space:]]/}" ]; then
            echo "::error::SLACK_WEBHOOK_URL 이 비어 있습니다 — 알림을 보낼 수 없어 실행을 멈춥니다"
            exit 1
          fi
          echo "SLACK_WEBHOOK_URL 있음"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 카드 이미지용 브라우저 설치 (카톡 켰을 때만)
        if: env.KAKAO_ENABLED == '1' && inputs.slack_test != '1'
        run: playwright install --with-deps chromium

      - name: 한글 폰트 설치 (카톡 켰을 때만)
        if: env.KAKAO_ENABLED == '1' && inputs.slack_test != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 되감기 (테스트용)
        if: inputs.rewind != '' && inputs.slack_test != '1'
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("state.json")
          s = json.loads(p.read_text()) if p.exists() else {}
          s["soco_last_board_id"] = int(os.environ["REWIND"])   # 봇이 읽는 키(예전엔 soco_last_no 를 바꿔 효과가 없었음)
          p.write_text(json.dumps(s, ensure_ascii=False, indent=2))
          print("rewound to", s["soco_last_board_id"])
          PY
        env:
          REWIND: ${{ inputs.rewind }}

      - name: 공고 확인 및 발송
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MYHOME_API_KEY: ${{ secrets.MYHOME_API_KEY }}
          SLACK_TEST: ${{ inputs.slack_test }}
          DRY_RUN: ${{ inputs.dry_run }}
          CARD_LIMIT: "3"
        run: python bot.py

      - name: 결과 커밋
        if: inputs.slack_test != '1' && inputs.dry_run != '1'
        run: |
          git config user.name  "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add state.json cards/ || true
          git diff --staged --quiet || git commit -m "공고 확인 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push   # 실패를 숨기지 않는다(발송은 됐는데 커밋이 안 올라간 상황을 실패로 드러냄)

      - name: 오래된 카드 정리 (60일)
        if: inputs.slack_test != '1' && inputs.dry_run != '1'
        run: |
          find cards -name '*.png' -mtime +60 -delete || true
          git add cards/ || true
          git diff --staged --quiet || (git commit -m "오래된 카드 정리" && git push) || true
