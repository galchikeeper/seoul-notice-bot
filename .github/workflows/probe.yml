name: 사이트 읽힘 점검 (읽기 전용)

# 수동 실행만. 발송·상태 파일·커밋·비밀값 없음.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 표 읽기 시험 (저장된 실제 공고문 PDF)
        run: python -m unittest discover tests -v
      - name: 크로미움 설치 (점검용)
        run: playwright install --with-deps chromium
      - name: 사이트 점검
        run: python probe.py --chromium

  # 마이홈 공공데이터 API(data.go.kr 15108420) — 키는 Secret MYHOME_API_KEY, 출력하지 않는다.
  # 발급 직후 '등록되지 않은 키'면 실패로 끝내지 않고 30분 간격으로 최대 4번 다시 부른다.
  myhome-api:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: pip install requests
      - name: 마이홈 API 1회 호출 (미등록 키면 30분 간격 최대 4회 재시도)
        env:
          MYHOME_API_KEY: ${{ secrets.MYHOME_API_KEY }}
        run: |
          for i in 0 1 2 3 4; do
            if [ "$i" -gt 0 ]; then echo "myhome: 등록되지 않은 키 — 30분 뒤 다시 시도 ($i/4)"; sleep 1800; fi
            set +e; python myhome_probe.py; rc=$?; set -e
            if [ "$rc" -ne 3 ]; then exit $rc; fi
          done
          echo "::error::4번 다시 시도해도 등록되지 않은 키"; exit 3

